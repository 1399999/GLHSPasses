<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Flask Input Form</title>
</head>
    <body>
        <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <a class="nav-item nav-link" id="nav-home-tab" data-toggle="tab" href="/" role="tab" aria-controls="nav-home" aria-selected="false">Sample Functionality</a>
                <a class="nav-item nav-link active" id="nav-profile-tab" data-toggle="tab" href="/data" role="tab" aria-controls="nav-profile" aria-selected="true">Display Data</a>
            </div>
        </nav>

        <div class="mx-auto">

            <br/>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Location</th>
                        <th scope="col">User</th>
                        <th scope="col">Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for data_item in data_list %}
                        <tr>
                            <th scope="row">{{data_item[0]}}</th>
                            <td>{{data_item[1]}}</td>
                            <td>{{data_item[2]}}</td>
                            <td>{{data_item[3]}}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </body>
</html>

<style>
    .center {
        display: flex; 
        flex-direction: row;
        align-items: center; 
        justify-content: center;
    }
</style>
