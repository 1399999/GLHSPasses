<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-table@1.27.3/dist/bootstrap-table.min.css">

        <title>Flask Input Form</title>
    </head>
    <body>
        <nav>
            <div class="nav nav-tabs" id="nav-tab" role="tablist">
                <a class="nav-item nav-link" id="nav-home-tab" data-toggle="tab" href="/" role="tab" aria-controls="nav-home" aria-selected="false">Sample Functionality</a>
                <a class="nav-item nav-link active" id="nav-profile-tab" data-toggle="tab" href="/data" role="tab" aria-controls="nav-profile" aria-selected="true">Display Data</a>
                <a class="nav-item nav-link" id="nav-user-tab" data-toggle="tab" href="/user" role="tab" aria-controls="nav-user" aria-selected="false">User Management</a>
            </div>
        </nav>

        <div class="mx-auto">

            <br/>

            <table class="table table-striped" 
            data-toggle="table" 
            data-search="true" 
            data-show-columns="true" 
            data-show-refresh="true"
            data-show-columns-toggle-all="true"
            data-show-pagination-switch="true"
            data-show-toggle="true"
            data-show-fullscreen="true"
            data-buttons="buttons"
            data-buttons-class="light"
            data-click-to-select="false"
            data-multiple-select-row="true"
            data-pagination="true"
            data-regex-search="true">
                <thead>
                    <tr>
                        <th
        data-field="state"
        data-checkbox="true"
      ></th>
                        <th scope="col" data-sortable="true">Id</th>
                        <th scope="col" data-sortable="true">Location</th>
                        <th scope="col" data-sortable="true">User</th>
                        <th scope="col" data-sortable="true">Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for data_item in data_list %}
                        <tr>
                            <th></th>
                            <th scope="row">{{data_item[0]}}</td>
                            <td>{{data_item[1]}}</td>
                            <td>{{data_item[2]}}</td>
                            <td>{{data_item[3]}}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.27.3/dist/bootstrap-table.min.js"></script>
    </body>
</html>

<style>
    .center {
        display: flex; 
        flex-direction: row;
        align-items: center; 
        justify-content: center;
    }
</style>
