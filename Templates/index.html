<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Flask Input Form</title>
</head>
<body>
    <nav>
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
            <a class="nav-item nav-link active" id="nav-home-tab" data-toggle="tab" href="/" role="tab" aria-controls="nav-home" aria-selected="true">Sample Functionality</a>
            <a class="nav-item nav-link" id="nav-profile-tab" data-toggle="tab" href="/data" role="tab" aria-controls="nav-profile" aria-selected="false">Display Data</a>
            <a class="nav-item nav-link" id="nav-user-tab" data-toggle="tab" href="/user" role="tab" aria-controls="nav-user" aria-selected="false">User Management</a>
        </div>
    </nav>
    </div>

    <div class="mx-auto">

        <br/>

        <form method="POST">
            <div class="mb-3 w-25 mx-auto">
                <label for="stud_id" class="form-label">Enter Student ID:</label>
                <input type="text" class="form-control mx-auto" name="user_input_1" placeholder="Enter Student ID" id="stud_id">
            </div>

            <br/>
            
            <div class="mb-3 w-25 mx-auto">
                <label for="options" class="form-label">Choose a place to go:</label>

                <select name="user_input_2" id="options" class="form-select" required>
                    <option value="restroom">Restroom</option>
                    <option value="library">Library</option>
                    <option value="hallway">Hallway</option>
                    <option value="office">Office</option>
                    <option value="student_services">Student Services</option>
                </select>
            </div>

            <br/>

            <div display="display: flex; justify-content: center; align-items: center;" class="mb-3 w-25 mx-auto center">
                <button type="submit", value="submit", name="submit_btn", class="btn btn-outline-success">Submit</button>
            </div>
        </form>

        <div class="mb-3 w-25 mx-auto">
            {% if db_success == False %}
                <div class="alert alert-danger" role="alert">
                    Failed to add action to database. Please try again.
                </div>
            {% elif db_success == True %}
                <div class="alert alert-success" role="alert">
                    Successfully added action to database!
                </div>
            {% endif %}
        </div>

    </div>

</body>
</html>

<style>
    .center {
        display: flex; 
        flex-direction: row;
        align-items: center; 
        justify-content: center;
    }
</style>
