<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Register Account</title>
</head>
<body class="bg-light">

    <div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="card shadow-sm" style="width: 400px;">
            <div class="card-body p-4">

                {% if first_run %}
                    <h4 class="card-title mb-1 text-center">First-Time Setup</h4>
                    <p class="text-muted text-center small mb-4">Create the initial account</p>
                {% else %}
                    <h4 class="card-title mb-4 text-center">Create Account</h4>
                {% endif %}

                {% if error %}
                    <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
                {% endif %}
                {% if success %}
                    <div class="alert alert-success py-2" role="alert">{{ success }}</div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username"
                               placeholder="Choose a username" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="At least 6 characters" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                               placeholder="Repeat password" required>
                    </div>

                    {% if not first_run %}
                    <div class="mb-3">
                        <label for="role" class="form-label">Role</label>
                        <select class="form-select" id="role" name="role">
                            <option value="user" selected>User</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    {% endif %}

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success">
                            {% if first_run %}Create Account{% else %}Create Account{% endif %}
                        </button>
                    </div>
                </form>

                {% if not first_run %}
                <div class="text-center mt-3">
                    <a href="{{ url_for('home') }}" class="text-muted small">Back to Login</a>
                </div>
                {% endif %}

            </div>
        </div>
    </div>

</body>
</html>
